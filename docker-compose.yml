name: nurturehub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nurturehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nurturehub}
      POSTGRES_DB: ${POSTGRES_DB:-nurturehub}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nurturehub} -d ${POSTGRES_DB:-nurturehub}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nurturehub}:${POSTGRES_PASSWORD:-nurturehub}@db:5432/${POSTGRES_DB:-nurturehub}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-supersecretkeyfornurturehubdevelopment12345}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-NurtureHUB <noreply@nurturehub.org>}
      PIPELINE_DATA_DIR: /data/pipeline_data
      # ── Data protection (see .env.production.example for what each does) ──
      # The backend refuses to boot in production if the REQUIRED ones are unset.
      PHI_ENCRYPTION_KEYS: ${PHI_ENCRYPTION_KEYS:-}
      PHI_ENCRYPTION_ACTIVE_KEY: ${PHI_ENCRYPTION_ACTIVE_KEY:-}
      PHI_INDEX_KEY: ${PHI_INDEX_KEY:-}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      # The audit spool is the on-disk fallback that keeps events from being lost
      # when the database is briefly unavailable. It MUST live on a volume, or a
      # container restart discards exactly the evidence a restart-shaped incident
      # would need.
      AUDIT_SPOOL_PATH: /data/audit_spool/audit_spool.jsonl
      ORG_LEGAL_NAME: ${ORG_LEGAL_NAME:-}
      DPO_NAME: ${DPO_NAME:-}
      DPO_EMAIL: ${DPO_EMAIL:-}
      DPO_PHONE: ${DPO_PHONE:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@nurturehub.org}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ALLOW_DEV_ADMIN: ${ALLOW_DEV_ADMIN:-true}
      MFA_REQUIRED_FOR_ADMINS: ${MFA_REQUIRED_FOR_ADMINS:-false}
      HSTS_ENABLED: ${HSTS_ENABLED:-true}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      SERVE_LOCAL_UPLOADS: ${SERVE_LOCAL_UPLOADS:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      SESSION_ALLOW_LEGACY_TOKENS: ${SESSION_ALLOW_LEGACY_TOKENS:-true}
      RAW_EXPORT_MOCK: ${RAW_EXPORT_MOCK:-false}
    volumes:
      # Admin "Database" section: uploaded pipeline inputs, uploaded script
      # versions and every run's outputs. Must outlive the container — without
      # this, a redeploy wipes all pipeline data.
      - pipeline_data:/data/pipeline_data
      # Admin form-builder media (option images, action videos).
      - uploads_data:/app/uploads
      # Audit spool — see AUDIT_SPOOL_PATH above.
      - audit_spool:/data/audit_spool
    # Bound to localhost by default (host-only API/docs access at /docs). In
    # production the SPA reaches the backend via the frontend nginx proxy, not this.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # The Host header is taken from ALLOWED_HOSTS, not hardcoded to localhost.
      # Setting ALLOWED_HOSTS (which production requires) installs TrustedHostMiddleware,
      # and a probe sent as "Host: localhost" is answered 400 — the backend then never
      # goes healthy and the frontend never starts, which looks exactly like the app
      # being broken when it is in fact serving real traffic fine.
      test: ["CMD-SHELL", "python -c \"import os,urllib.request,sys; h=next((p.strip() for p in os.environ.get('ALLOWED_HOSTS','').split(',') if p.strip()), 'localhost'); r=urllib.request.Request('http://localhost:8000/', headers={'Host': h}); sys.exit(0 if urllib.request.urlopen(r).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s   # allow time for migrations + seed on first boot
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Empty => same-origin; nginx proxies /api and /ws to the backend.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    # Bound to localhost by default so a host-level nginx/TLS proxy is the only
    # public entrypoint. Set BIND_ADDR=0.0.0.0 to expose it directly.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db_data:
  pipeline_data:
  uploads_data:
  audit_spool:
