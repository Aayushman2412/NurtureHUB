{{- if .Values.gateway.enabled }}
{{- $full := include "eduposhan.fullname" . }}
{{- $t := .Values.gateway.timeouts }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $full }}
  labels:
    {{- include "eduposhan.labels" (dict "root" . "component" "routing") | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.publicHost | quote }}
  # The longest matching prefix wins, so /api/admin reaches the admin pod
  # before /api reaches the field tier — an analyst's export can never queue
  # behind, or in front of, a health worker's form.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/admin
        - path:
            type: PathPrefix
            value: /uploads
      backendRefs:
        - name: {{ $full }}-admin
          port: 8000
      {{- with $t.admin }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /ws
      backendRefs:
        - name: {{ $full }}-realtime
          port: 8000
      {{- with $t.websocket }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ $full }}-api
          port: 8000
      {{- with $t.api }}
      timeouts:
        request: {{ . | quote }}
      {{- end }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $full }}-frontend
          port: 80
{{- end }}
