# NurtureHUB frontend — serves the SPA and reverse-proxies the API + WebSockets
# to the backend service, so the browser only ever talks to this one origin.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 10m;

    # ── Security headers for documents nginx serves itself ──────────────────
    # The backend sets its own headers on /api and /uploads responses; these
    # cover index.html, the service worker and the hashed assets, which the
    # backend never sees. `always` matters: without it nginx omits them on error
    # responses, which is precisely where a framed or sniffed page can bite.
    #
    # The CSP is written for a Vite build: hashed scripts and styles from this
    # origin, no inline script, images and fonts from self plus data: URIs, and
    # connections limited to this origin (the API is same-origin through this
    # proxy) plus the R2 media host when one is configured. `frame-ancestors
    # 'none'` is what stops a clickjacked overlay over a patient record.
    add_header X-Content-Type-Options            "nosniff" always;
    add_header X-Frame-Options                   "DENY" always;
    add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy        "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Permissions-Policy
        "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), interest-cohort=()" always;
    # style-src keeps 'unsafe-inline' because Tailwind emits inline style
    # attributes for dynamic values; script-src deliberately does not.
    # If media moves to a custom R2 domain, add it to img-src and media-src.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # REST API -> backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin "Database" section: pipeline input/script uploads and multi-hundred-MB
    # output downloads. The 10m default above would reject these, and a full
    # crosstabs run takes minutes, so the read timeout is raised to match.
    location /api/admin/pipelines/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 500m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # Uploaded form media (learner photos, option images, action videos) is
    # served by the backend's static mount. Without this location the SPA
    # fallback would answer /uploads/ with index.html — broken images that the
    # service worker would then cache as "media".
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (live test monitoring) -> backend
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # PWA: the service worker, manifest and index.html must be revalidated on
    # every load — a stale SW would pin users to an old build for up to 24h.
    #
    # NOTE: nginx's add_header REPLACES the inherited set inside a nested block
    # rather than adding to it. Every location below that sets Cache-Control
    # must therefore restate the security headers, or those documents ship with
    # none — index.html included, which is the one that matters most.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options            "nosniff" always;
        add_header X-Frame-Options                   "DENY" always;
        add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy        "same-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy
            "geolocation=(self), camera=(self), microphone=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA client-side routing — serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
