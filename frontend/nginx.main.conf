# NurtureHUB frontend container — nginx MAIN config (replaces the image default).
#
# Why this file exists: every live candidate is a WebSocket held open for the
# whole test, and this container proxies each one to the backend — two
# connections per candidate. The image default allows 1024 connections per
# worker, and nginx does not spread connections evenly across workers, so at a
# few thousand candidates one worker can hit its ceiling and start refusing
# connections while the others sit idle. Explicit, generous limits instead.
#
# The site itself (routes, proxying, headers) stays in nginx.conf, installed as
# conf.d/default.conf and included below.

user  nginx;
worker_processes  8;
worker_rlimit_nofile  65536;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    # 8 workers x 8192 = 65k connections: ~5x headroom over 6,000 candidates.
    worker_connections  8192;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
