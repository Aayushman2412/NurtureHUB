name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Frontend: Typecheck & Production Bundle
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Solution Typecheck and Build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Backend: Migrations & Automated Tests with Postgres
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Migrations & Pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nurturehub
          POSTGRES_PASSWORD: test_password_ci
          POSTGRES_DB: nurturehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check for a single Alembic head
        working-directory: backend
        env:
          ALEMBIC_DATABASE_URL: postgresql://nurturehub:test_password_ci@localhost:5432/nurturehub_test
        run: |
          heads="$(alembic heads)"
          count="$(printf '%s\n' "$heads" | grep -c . || true)"
          printf 'Alembic heads found (%s):\n%s\n\n' "$count" "$heads"
          if [ "$count" -ne 1 ]; then
            echo "FAILED: Multiple Alembic heads detected. Chain must be linear."
            exit 1
          fi

      - name: Test Alembic migrations from scratch (upgrade head)
        working-directory: backend
        env:
          ALEMBIC_DATABASE_URL: postgresql://nurturehub:test_password_ci@localhost:5432/nurturehub_test
        run: alembic upgrade head

      - name: Run Pytest test suite
        working-directory: backend
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://nurturehub:test_password_ci@localhost:5432/nurturehub_test
          ALEMBIC_DATABASE_URL: postgresql://nurturehub:test_password_ci@localhost:5432/nurturehub_test
          JWT_SECRET_KEY: test_jwt_secret_ci_environment_key_32_bytes_long
          PHI_ENCRYPTION_KEYS: v1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY
          PHI_ENCRYPTION_ACTIVE_KEY: v1
          PHI_INDEX_KEY: test_phi_index_key_ci
          AUDIT_HMAC_KEY: test_audit_hmac_key_ci_0123456789abcdef
        run: pytest tests/ -v

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Docker: Validate Container Builds
  # ────────────────────────────────────────────────────────────────────────────
  docker-check:
    name: Dockerfile Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: nurturehub-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: nurturehub-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
