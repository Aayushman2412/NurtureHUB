name: CD Pipeline (Build, Publish & Deploy)

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: 'Deploy to remote production server after building images?'
        required: true
        type: boolean
        default: true

# Ensure only one deployment runs at a time to prevent race conditions on the server
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Build and Publish Backend Image to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  publish-backend:
    name: Build & Publish Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Backend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Build and Publish Frontend Image to GHCR
  # ────────────────────────────────────────────────────────────────────────────
  publish-frontend:
    name: Build & Publish Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for Frontend
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Continuous Deployment (Remote Host Rollout)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Production Rollout (Narmada)
    needs: [publish-backend, publish-frontend]
    runs-on: self-hosted
    if: |
      always() &&
      needs.publish-backend.result == 'success' &&
      needs.publish-frontend.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_to_server == 'true')
    steps:
      - name: Deploy Containers on Server
        run: |
          echo "Starting zero-downtime deployment on narmada..."
          cd /websites_dir/NurtureHUB

          # Sync repository files (compose files, config, migrations)
          git pull origin main

          # Authenticate Docker with GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Pull latest pre-built container images from GHCR
          docker compose pull

          # Re-create and restart containers with new images
          docker compose up -d --remove-orphans

          # Run database migrations from the updated backend container
          echo "Applying Alembic database migrations..."
          docker compose exec -T backend alembic upgrade head

          # Verify container health
          echo "Verifying service health..."
          docker compose ps
          echo "Deployment completed successfully!"
